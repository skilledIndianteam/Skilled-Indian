name: Build Skilled Indian APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # 1. GitHub repository की files लेना
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17 setup
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK setup
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Android SDK packages install
      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 5. Gradle setup
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 6. Android APK build
      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon

      # 7. APK को आसान नाम देना
      - name: Prepare APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk \
             output/Skilled-Indian.apk

      # 8. APK को GitHub Actions में save करना
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Skilled-Indian-APK
          path: output/Skilled-Indian.apk
          retention-days: 30
